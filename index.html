<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HuntAI Dashboard</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="dashboard">
    <div class="header">
      <h1>Dashboard</h1>
    </div>
    <div class="profile">
      <div class="profile-header">
        <img src="profile-image.jpg" alt="Profile" id="profile-image">
        <h2 id="username">CryptoHunter</h2>
        <p id="rank">Top 10%</p>
      </div>
      <div class="progress-bar">
        <div class="progress" id="xp-progress"></div>
        <p id="xp-text">2450 / 3000 XP</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat-item">
        <p>Completed Missions</p>
        <span id="missions-completed">18</span>
      </div>
      <div class="stat-item">
        <p>Weekly Growth</p>
        <span id="weekly-growth">+368 XP</span>
      </div>
    </div>
    <div class="quick-start">
      <p>Quick Start</p>
      <button id="startMissionBtn">Start New Mission</button>
    </div>
    <div class="leaderboard">
      <h2>Leaderboard</h2>
      <table id="leaderboard-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Username</th>
            <th>XP</th>
          </tr>
        </thead>
        <tbody>
          <!-- Table content will be populated dynamically -->
        </tbody>
      </table>
    </div>
  </div>
  <script src="./script.js"></script>
</body>
</html>
