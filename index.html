<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HuntAI Dashboard</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">
  <div class="max-w-md mx-auto p-4">
    <!-- Header -->
    <h1 class="text-3xl font-bold text-gradient bg-gradient-to-r from-blue-500 to-purple-600 text-transparent bg-clip-text">Dashboard</h1>

    <!-- Profile Card -->
    <div class="bg-white rounded-xl shadow-md mt-6 p-4 flex items-center space-x-4">
      <img id="profile-pic" src="" class="w-14 h-14 rounded-full" alt="Profile">
      <div>
        <div id="username" class="text-xl font-semibold">User</div>
        <div class="text-sm text-gray-500">Top 10% • <span id="rank">Hunter</span></div>
        <div class="mt-2 w-full bg-gray-200 rounded-full h-2">
          <div id="xp-bar" class="bg-purple-500 h-2 rounded-full" style="width: 75%"></div>
        </div>
        <div class="text-sm mt-1"><span id="xp">2450</span> / 3000 XP</div>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-2 gap-4 mt-4">
      <div class="bg-white rounded-xl shadow-md p-4 text-center">
        <div class="text-sm text-gray-600">Missions Completed</div>
        <div id="missions" class="text-xl font-bold">18</div>
      </div>
      <div class="bg-white rounded-xl shadow-md p-4 text-center">
        <div class="text-sm text-gray-600">Weekly Growth</div>
        <div id="weekly" class="text-xl font-bold text-green-600">+368 XP</div>
      </div>
    </div>

    <!-- CTA -->
    <div class="mt-6 bg-gradient-to-r from-teal-400 to-purple-500 rounded-xl p-4 text-white text-center">
      <div class="text-lg font-semibold">Quick Start</div>
      <p class="text-sm">Ready for your next challenge?</p>
      <button onclick="startMission()" class="mt-3 bg-white text-purple-600 font-semibold px-4 py-2 rounded-xl">⚡ Start New Mission</button>
    </div>
  </div>

  <script>
    Telegram.WebApp.ready();
    const user = Telegram.WebApp.initDataUnsafe.user;
    document.getElementById("username").textContent = user?.first_name || "Hunter";
    if (user?.photo_url) {
      document.getElementById("profile-pic").src = user.photo_url;
    }
    function startMission() {
      alert("Mission started (будет связка с XP позже)");
    }
  </script>
</body>
</html>
